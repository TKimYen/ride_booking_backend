# Nạp cấu hình siết chặt đầu vào (Jackson + giới hạn body + Tomcat).
# Tách riêng thành file có tên khác application.properties là CỐ Ý: nếu để
# chung trong application.properties của main thì file này sẽ che mất nó trên
# classpath, và test sẽ chạy với config rỗng - tức là test không hề kiểm tra được
# cấu hình đang chạy thật ngoài production.
spring.config.import=classpath:/application-hardening.properties

# H2 in-memory: test không cần PostgreSQL hay Docker.
# MODE=PostgreSQL để câu truy vấn viết cho Postgres chạy được ở đây; nếu không,
# một câu đúng với Postgres lại sai ở H2 thì test vẫn xanh trong khi production đỏ.
spring.datasource.url=jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test không gọi discovery-server và không gọi user-service thật.
# Client user-service bị thay bằng bean giả trong test, nhưng Eureka thì sẽ cố
# đăng ký vào localhost:8761 rồi log lỗi lặp lại suốt test.
eureka.client.enabled=false

app.jwt.secret=test-secret-key-for-booking-service-tests-0123456789
app.internal.key=test-key
app.clients.user-service.base-url=http://localhost:65535/none
app.booking.seat-hold-minutes=10

# Tắt job hết hạn trong test: @Scheduled khởi động cùng context và có thể chạy
# xen giữa các ca kiểm thử, làm ghế/đơn đổi trạng thái ngoài ý muốn.
app.booking.expiry-job.enabled=false
