spring.application.name=booking-service
server.port=8083

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# PostgreSQL - database RIÊNG của booking-service
# Cố ý CHUNG database cho catalog + booking: thuật toán giữ ghế cần khoá dòng
# trip_seats rồi ghi bookings trong cùng một transaction. Tách database sẽ mất
# transaction và phải tự viết distributed lock.
#
# Mặc định DB_PORT là 5435 (cổng host của booking-db), KHÔNG phải 5432 của
# auth_db. Đặt nhầm 5432 thì với ddl-auto=update, Hibernate sẽ tạo bảng
# locations/trips/... bên trong auth_db — sai database mà không có lỗi nào báo,
# chỉ thấy dữ liệu bò vào chỗ lạ. Trong Docker, compose ghi đè DB_PORT=5432
# (cổng trong network).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:booking_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# update  : mặc định cho dev, Hibernate tự tạo/sửa bảng
# validate: dùng cho production, chỉ kiểm tra schema khớp, KHÔNG sửa
#   Khi đặt validate, chạy database/03_booking_db.sql một lần để tạo schema trước.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT - PHẢI khớp với auth-service
app.jwt.secret=${JWT_SECRET:ride-booking-microservices-dev-secret-key-change-me-0123456789}
app.jwt.issuer=ride-booking-auth-service

# Khoá gọi API nội bộ (payment-service sẽ dùng key này để ghi bảng payments)
app.internal.key=${INTERNAL_API_KEY:ride-booking-internal-dev-key}

# user-service: lấy tên/email người đặt vé để hiển thị "Đơn hàng của tôi", và tên
# người đánh giá. booking_db không join được user_db nên phải gọi qua HTTP.
app.clients.user-service.base-url=${USER_SERVICE_URL:http://localhost:8082}

# Timeout gọi user-service. Ngắn vì đây là phụ thuộc của Trang chi tiết và Trang
# đánh giá: user-service treo thì trang của khách không được treo theo.
app.clients.user-service.timeout-ms=${USER_SERVICE_TIMEOUT_MS:1500}

# Cache tên hiển thị. TTL 5 phút đủ để dùng lại giữa các trang đánh giá mà vẫn
# nhận được tên mới sau khi khách sửa hồ sơ. Có trần số mục để cache không phình
# vô hạn khi user-service lỗi liên tục.
app.clients.user-service.cache-ttl-seconds=${USER_SERVICE_CACHE_TTL_SECONDS:300}
app.clients.user-service.cache-max-entries=${USER_SERVICE_CACHE_MAX_ENTRIES:5000}

# Thời gian giữ ghế. Một biến cho CẢ HAI chỗ: đồng hồ đếm ngược trên header
# Trang Chọn chỗ và job trả ghế về AVAILABLE. Tách thành hai biến thì rất dễ
# cấu hình lệch nhau, lúc đó đồng hồ báo hết giờ nhưng ghế vẫn bị giữ.
app.booking.seat-hold-minutes=${SEAT_HOLD_MINUTES:10}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Logging
logging.level.com.ridebooking.booking=INFO
# CORS - chỉ cho phép các origin này gọi API (phân cách bằng dấu phẩy).
# Production: đổi thành domain thật, ví dụ https://ridebooking.vn
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

# Nạp cấu hình siết chặt đầu vào (Jackson + giới hạn body + Tomcat).
# Tách riêng thành file có tên khác application.properties là CỐ Ý: nếu để
# chung trong application.properties của main thì src/test/resources/application.properties
# sẽ che mất nó trên classpath, và test sẽ chạy với config rỗng - tức là test
# không hề kiểm tra được cấu hình đang chạy thật ngoài production.
spring.config.import=classpath:/application-hardening.properties