spring.application.name=payment-service
server.port=8084

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# KHÔNG có datasource: payment-service không sở hữu database nào. Bảng payments
# nằm trong booking_db và chỉ được ghi qua API nội bộ của booking-service. Nhờ
# vậy trạng thái tiền và trạng thái ghế luôn nằm trong cùng một transaction.
# (Không khai spring.datasource vì module không kéo JPA/JDBC vào.)

# JWT - PHẢI khớp với auth-service
app.jwt.secret=${JWT_SECRET:ride-booking-microservices-dev-secret-key-change-me-0123456789}
app.jwt.issuer=ride-booking-auth-service

# booking-service: nguồn sự thật của đơn và thanh toán
app.clients.booking-service.base-url=${BOOKING_SERVICE_URI:http://localhost:8083}
app.clients.booking-service.timeout-ms=${BOOKING_SERVICE_TIMEOUT_MS:1500}
# Khoá nội bộ phải trùng app.internal.key của booking-service (Docker: INTERNAL_API_KEY)
app.clients.booking-service.internal-key=${INTERNAL_API_KEY:ride-booking-internal-dev-key}

# Stripe. secret-key và webhook-secret BẮT BUỘC có ở môi trường thật; để rỗng thì
# service vẫn khởi động nhưng mọi lời gọi thanh toán trả 502 kèm thông báo rõ ràng.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.currency=${STRIPE_CURRENCY:vnd}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/my-bookings}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/booking/cancel}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

logging.level.com.ridebooking.payment=INFO
