spring.application.name=user-service
server.port=8082

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# PostgreSQL - database RIÊNG của user-service (tách khỏi auth-service)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# update  : mặc định cho dev, Hibernate tự tạo/sửa bảng
# validate: dùng cho production, chỉ kiểm tra schema khớp, KHÔNG sửa
#   Khi đặt validate, chạy database/*.sql một lần để tạo schema trước.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# JWT - PHẢI khớp với auth-service
app.jwt.secret=${JWT_SECRET:ride-booking-microservices-dev-secret-key-change-me-0123456789}
app.jwt.issuer=ride-booking-auth-service

# Khoá gọi API nội bộ (phải khớp với app.clients.user-service.internal-key của auth-service)
app.internal.key=${INTERNAL_API_KEY:ride-booking-internal-dev-key}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Logging
logging.level.com.ridebooking.user=INFO
# CORS - chỉ cho phép các origin này gọi API (phân cách bằng dấu phẩy).
# Production: đổi thành domain thật, ví dụ https://ridebooking.vn
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

# Nạp cấu hình siết chặt đầu vào (Jackson + giới hạn body + Tomcat).
# Tách riêng thành file có tên khác application.properties là CỐ Ý: nếu để
# chung trong application.properties của main thì src/test/resources/application.properties
# sẽ che mất nó trên classpath, và test sẽ chạy với config rỗng - tức là test
# không hề kiểm tra được cấu hình đang chạy thật ngoài production.
spring.config.import=classpath:/application-hardening.properties
