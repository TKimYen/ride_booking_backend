# =====================================================================
# Cấu hình siết chặt đầu vào — NẠP TỪ CẢ main lẫn test.
#
# File này tồn tại tách biệt có chủ đích: src/test/resources/application.properties
# trùng TÊN với file main, và trên classpath file test nằm trước nên file main bị che.
# Hậu quả nếu để chung: integration test đọc config rỗng, mọi giới hạn bảo mật đặt trong
# đây đều KHÔNG được test thấy - và từng xảy ra: test báo 201 cho JSON key trùng
# trong khi stack thật trả 400. Tên khác application.properties thì không file nào che được.
# =====================================================================
# ---- Chặn JSON có key trùng (parser differential / WAF bypass) ----
# Jackson mặc định cho phép key lặp và LẤY GIÁ TRỊ CUỐI:
#   {"email":"first@x.com","email":"second@x.com"} -> tao user cho second@x.com
# Hai bên đọc khác nhau là lỗ hổng kinh điển: sau này đặt Cloudflare/nginx
# validate email và nó đọc giá trị ĐẦU, còn app đọc giá trị CUỐI -> tạo tài
# khoản ngoài ý muốn mà WAF không chặn được. Bật chế độ nghiêm ngặt: key trùng
# -> JsonParseException -> HttpMessageNotReadableException -> 400.
spring.jackson.read.STRICT_DUPLICATE_DETECTION=true

# ---- Giới hạn kích thước request ----
# KHÔNG dựa vào mặc định của framework:
#   * max-http-form-post-size CHỈ áp cho application/x-www-form-urlencoded.
#     Body application/json được đọc thẳng qua InputStream nên Tomcat KHÔNG
#     giới hạn gì cả - đã thử gửi 20MB JSON, server đọc trọn vào RAM mới
#     reject. Do đó có RequestBodySizeLimitFilter tự chặn (413).
#   * max-swallow-size: khi đã trả lỗi mà body chưa hết, Tomcat chỉ đọc bỏ
#     tối đa lượng này rồi đóng connection, thay vì hút hết body của kẻ tấn công.
#   * max-http-request-header-size: chặn header khổng lồ (chặn slow-loris kiểu header).
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB
server.max-http-request-header-size=16KB
# Ngưỡng cho filter ở trên, tính cả request chunked không có Content-Length.
app.request.max-body-bytes=65536
