spring.application.name=auth-service
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# PostgreSQL - database RIÊNG của auth-service (tách khỏi user-service)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# update  : mặc định cho dev, Hibernate tự tạo/sửa bảng
# validate: dùng cho production, chỉ kiểm tra schema khớp, KHÔNG sửa
#   Khi đặt validate, chạy database/*.sql một lần để tạo schema trước.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# JWT
# QUAN TRỌNG (production): đặt JWT_SECRET qua biến môi trường, tối thiểu 32 ký tự.
app.jwt.secret=${JWT_SECRET:ride-booking-microservices-dev-secret-key-change-me-0123456789}
# Access token sống 15 phút - client tự gọi /api/auth/refresh khi hết hạn.
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
app.jwt.issuer=ride-booking-auth-service
# Refresh token sống 7 ngày, lưu hash SHA-256 trong bảng refresh_tokens.
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}

# Chống brute-force: khoá tài khoản sau N lần đăng nhập sai liên tiếp.
# Chống brute-force: khoá theo CẶP (email + IP), KHÔNG khoá cả tài khoản.
# Nhờ vậy không ai khoá nhầm được tài khoản của người khác chỉ bằng cách biết email.
app.login-security.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.login-security.lock-minutes=${LOGIN_LOCK_MINUTES:15}
app.login-security.admin-unlock-enabled=${LOGIN_ADMIN_UNLOCK_ENABLED:true}
# Tổng số lần sai từ 1 IP trong cửa sổ thời gian — chặn rải mật khẩu, dò email
app.login-security.max-failed-attempts-per-ip=${LOGIN_MAX_FAILED_ATTEMPTS_PER_IP:20}
app.login-security.ip-window-minutes=${LOGIN_IP_WINDOW_MINUTES:15}

# ---- Gửi email ----
# Mặc định trỏ mailpit trong docker-compose. Muốn gửi thật: đặt MAIL_HOST/MAIL_PORT/
# MAIL_USERNAME/MAIL_PASSWORD trong .env (Gmail: smtp.gmail.com:587 + App Password).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Không chặn request chỉ vì SMTP hỏng (xem MailService)
spring.mail.properties.mail.smtp.retry-times=1

app.email.from=${MAIL_FROM:no-reply@ridebooking.local}
app.email.from-name=${MAIL_FROM_NAME:Ride Booking}
app.email.security-to=${MAIL_SECURITY_TO:}
app.email.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Bật true ở production: bắt buộc xác minh email mới đăng nhập được
app.email.require-verified-for-login=${EMAIL_VERIFY_REQUIRED_FOR_LOGIN:false}
app.email.verify-ttl-minutes=${EMAIL_VERIFY_TTL_MINUTES:1440}
app.email.password-reset-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
app.email.email-change-ttl-minutes=${EMAIL_CHANGE_TTL_MINUTES:60}
app.email.max-per-email-per-window=${EMAIL_MAX_PER_EMAIL:3}
# Giới hạn theo IP chỉ chặn spam dạng dò nhiều email. KHÔNG đặt quá thấp: một
# văn phòng hay mạng di động có thể có hàng trăm người dùng chung một IP, đặt
# nhỏ sẽ chặn oan cả văn phòng.
app.email.max-per-ip-per-window=${EMAIL_MAX_PER_IP:30}
app.email.resend-window-minutes=${EMAIL_RESEND_WINDOW_MINUTES:60}
app.email.history-retention-days=${EMAIL_HISTORY_RETENTION_DAYS:7}

# Để Tomcat phân giải X-Forwarded-For chỉ khi request đến từ proxy tin cậy.
# Cần thiết để rate limit theo IP nhìn thấy IP thật của client sau gateway.
# Nhờ vậy code KHÔNG phải tự tin X-Forwarded-For (client kiểm soát được header đó).
server.forward-headers-strategy=native
# ---- Danh sach proxy duoc tin: quyet dinh co lay IP client tu X-Forwarded-For ----
# RemoteIpValve doc X-Forwarded-For TINH TIEN (trai -> phai) va BO QUA moi dia
# chi khop internal-proxies. Mac dinh cua Tomcat la:
#   10.*, 192.168.*, 169.254.*, 127.*, 172.16-31.*
# Docker bridge luon nằm trong 172.16/12, nen mac dinh đó coi MỌI container
# la proxy tin cậy. Hai hậu quả do chính Docker tao ra:
#   1. Request đi qua gateway: X-Forwarded-For = "172.28.0.1" (IP host that) bi
#      bo qua hop -> Tomcat rơi ve remoteAddr cua gateway (172.28.0.10), nen moi
#      nguoi dung lai chung mot IP va gioi han theo IP tro thanh gioi han toan cuc.
#   2. Request đi thang 8081 voi X-Forwarded-For gia: header bi chap nhan, ke do
#      kẻ tấn công tu chon duoc IP de né gioi han.
# Vì vậy chi tin DUNG dia chi IP cua gateway (gan tinh trong docker-compose.yml).
# Khi chạy ngoài Docker, dat AUTH_TRUSTED_PROXY_IPS thanh IP cua nginx/ALB
# that, ví du: ^(?:10\\.0\\.1\\.5|192\\.168\\.1\\.10)$
# Lưu ý: đây là REGEX, nên dấu chấm phải viết \\. trong file properties.
server.tomcat.remoteip.internal-proxies=${AUTH_TRUSTED_PROXY_IPS:172\\.28\\.0\\.10}

# Kết nối sang user-service để đồng bộ hồ sơ khi đăng ký
app.clients.user-service.base-url=${USER_SERVICE_URL:http://localhost:8082}
app.clients.user-service.connect-timeout-millis=3000
app.clients.user-service.read-timeout-millis=5000
app.clients.user-service.internal-key=${INTERNAL_API_KEY:ride-booking-internal-dev-key}

# Tài khoản admin tạo sẵn lúc khởi động (xem AdminBootstrap).
# Bỏ trống ADMIN_EMAIL thì không tạo gì - dùng khi production đã có admin sẵn.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${ADMIN_NAME:Quản trị viên}

# Dọn refresh token hết hạn từ lâu (chạy 1 lần/ngày, xoá sau 30 ngày)
app.jwt.refresh-token-purge-cron=${REFRESH_TOKEN_PURGE_CRON:0 0 3 * * *}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Logging
logging.level.com.ridebooking.auth=INFO

# Không để in password hash ra log
logging.level.org.springframework.security=INFO
# CORS - chỉ cho phép các origin này gọi API (phân cách bằng dấu phẩy).
# Production: đổi thành domain thật, ví dụ https://ridebooking.vn
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

# Nạp cấu hình siết chặt đầu vào (Jackson + giới hạn body + Tomcat).
# Tách riêng thành file có tên khác application.properties là CỐ Ý: nếu để
# chung trong application.properties của main thì src/test/resources/application.properties
# sẽ che mất nó trên classpath, và test sẽ chạy với config rỗng - tức là test
# không hề kiểm tra được cấu hình đang chạy thật ngoài production.
spring.config.import=classpath:/application-hardening.properties
