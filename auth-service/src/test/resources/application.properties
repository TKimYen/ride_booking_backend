# Nạp cấu hình siết chặt đầu vào (Jackson + giới hạn body + Tomcat).
# Tách riêng thành file có tên khác application.properties là CỐ Ý: nếu để
# chung trong application.properties của main thì src/test/resources/application.properties
# sẽ che mất nó trên classpath, và test sẽ chạy với config rỗng - tức là test
# không hề kiểm tra được cấu hình đang chạy thật ngoài production.
spring.config.import=classpath:/application-hardening.properties

# Cấu hình riêng cho test: dùng H2 in-memory nên test không cần PostgreSQL/Docker.
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Không gọi user-service trong context test
app.clients.user-service.base-url=http://localhost:1
app.clients.user-service.internal-key=test-key

# Mail: cổng 1 để kết nối bị từ chối ngay lập tức. MailService nuốt lỗi gửi nên
# test vẫn kiểm tra được phần còn lại, mà test không bị treo chờ timeout SMTP.
spring.mail.host=localhost
spring.mail.port=1
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
app.email.from=no-reply@test.local
app.email.frontend-url=http://localhost:5173
# Cho phép đăng nhập khi chưa xác minh để không phá các test luồng cũ
app.email.require-verified-for-login=false
