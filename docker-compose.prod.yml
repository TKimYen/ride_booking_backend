# Cấu hình staging/production — GHI ĐÈ lên docker-compose.yml, không chạy riêng:
#
#   cp .env.prod.example .env.prod      # rồi điền giá trị thật
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml config   # kiểm tra
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Khác bản dev:
#   - Bí mật (JWT, khoá nội bộ, mật khẩu DB/admin, Stripe) và CORS_ALLOWED_ORIGINS
#     KHÔNG có giá trị mặc định: thiếu biến nào thì compose dừng ngay và báo tên biến.
#   - Chỉ gateway mở cổng ra ngoài. Database, Eureka và các service chỉ nói chuyện
#     trong mạng Docker (bản dev mở ra 127.0.0.1 để debug).
#   - Không chạy mailpit: phải khai SMTP thật (Gmail/Brevo/SES).
#   - Giới hạn gửi email theo IP về mức production.
#   - Dùng được Postgres ngoài (Neon/Render): đặt *_DB_HOST, *_DB_NAME và
#     *_DB_URL_PARAMS=?sslmode=require. Khi đó container *-db trong compose vẫn
#     chạy nhưng không ai dùng; bỏ qua được.
#
# Cần Docker Compose >= 2.24 (thẻ !reset bỏ cổng của bản dev, !override thay hẳn danh sách).

x-prod-env: &prod-env
  EUREKA_URL: http://discovery-server:8761/eureka
  JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET (tối thiểu 32 ký tự ngẫu nhiên)}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Thiếu INTERNAL_API_KEY}
  # Domain frontend thật, ví dụ https://xego.vercel.app — phân cách bằng dấu phẩy, KHÔNG dùng *
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Thiếu CORS_ALLOWED_ORIGINS (domain frontend)}
  APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Thiếu APP_FRONTEND_URL (link trong email)}

services:
  # ---------------------------------------------------------------- databases
  auth-db:
    environment:
      POSTGRES_USER: ${DB_USER:?Thiếu DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD}
    ports: !reset []
    restart: always

  user-db:
    environment:
      POSTGRES_USER: ${DB_USER:?Thiếu DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD}
    ports: !reset []
    restart: always

  booking-db:
    environment:
      POSTGRES_USER: ${DB_USER:?Thiếu DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD}
    ports: !reset []
    restart: always

  # Không khởi động trừ khi gọi rõ: --profile dev-mail
  mailpit:
    profiles: ["dev-mail"]
    ports: !reset []

  # ---------------------------------------------------------------- services
  discovery-server:
    ports: !reset []
    restart: always

  auth-service:
    environment:
      <<: *prod-env
      DB_HOST: ${AUTH_DB_HOST:-auth-db}
      DB_PORT: ${AUTH_DB_PORT_INTERNAL:-5432}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      DB_USER: ${AUTH_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-${DB_PASSWORD}}
      DB_URL_PARAMS: ${AUTH_DB_URL_PARAMS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Thiếu ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Thiếu ADMIN_PASSWORD (đừng dùng mật khẩu mặc định)}
      MAIL_HOST: ${MAIL_HOST:?Thiếu MAIL_HOST (SMTP thật)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Thiếu MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Thiếu MAIL_PASSWORD}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Thiếu MAIL_FROM}
      EMAIL_MAX_PER_IP: ${EMAIL_MAX_PER_IP:-30}
    depends_on: !override
      discovery-server:
        condition: service_started
      auth-db:
        condition: service_healthy
    ports: !reset []
    restart: always

  user-service:
    environment:
      <<: *prod-env
      DB_HOST: ${USER_DB_HOST:-user-db}
      DB_PORT: ${USER_DB_PORT_INTERNAL:-5432}
      DB_NAME: ${USER_DB_NAME:-user_db}
      DB_USER: ${USER_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${USER_DB_PASSWORD:-${DB_PASSWORD}}
      DB_URL_PARAMS: ${USER_DB_URL_PARAMS:-}
    ports: !reset []
    restart: always

  booking-service:
    environment:
      <<: *prod-env
      DB_HOST: ${BOOKING_DB_HOST:-booking-db}
      DB_PORT: ${BOOKING_DB_PORT_INTERNAL:-5432}
      DB_NAME: ${BOOKING_DB_NAME:-booking_db}
      DB_USER: ${BOOKING_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-${DB_PASSWORD}}
      DB_URL_PARAMS: ${BOOKING_DB_URL_PARAMS:-}
      # Staging: bật SEED_ENABLED=true ở lần chạy đầu để có dữ liệu demo.
      SEED_ENABLED: ${SEED_ENABLED:-false}
      # Production KHÔNG bù chuyến mẫu: chuyến do admin tạo.
      SEED_TRIP_TOPUP: ${SEED_TRIP_TOPUP:-false}
      MAIL_HOST: ${MAIL_HOST:?Thiếu MAIL_HOST (SMTP thật)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Thiếu MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Thiếu MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?Thiếu MAIL_FROM}
    ports: !reset []
    restart: always

  payment-service:
    environment:
      <<: *prod-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Thiếu STRIPE_SECRET_KEY (sk_test_... cho staging)}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Thiếu STRIPE_WEBHOOK_SECRET (whsec_...)}
      # Trang kết quả trên frontend thật
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:?Thiếu STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:?Thiếu STRIPE_CANCEL_URL}
    ports: !reset []
    restart: always

  api-gateway:
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Thiếu CORS_ALLOWED_ORIGINS (domain frontend)}
      # Sau nginx/Caddy trên cùng VPS: TCP peer là bridge gateway của Docker.
      # Sau proxy khác (Render, ALB) thì đổi sang dải IP của proxy đó.
      GATEWAY_TRUSTED_PROXIES: '${GATEWAY_TRUSTED_PROXIES:-(172\.28\.0\.1|127\.0\.0\.1)}'
    ports: !override
      # Mặc định chỉ nghe localhost: đặt nginx/Caddy phía trước để có HTTPS.
      # Không có reverse proxy thì đặt GATEWAY_BIND=0.0.0.0 (chỉ nên làm cho staging).
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8088}:8088"
    restart: always
